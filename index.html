<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class = "calculator">
        <div class = "display">
            <div id = "completeOperation"> </div>
            <div id = "currentNumber">0</div>
        </div>
        <div class = "buttons">
            <div class = "row"> 
                <button class = "function" id = "modulus">%</button>
                <button class = "function" id = "delete">DEL</button>
                <button class = "function" id = "clear">C</button>
                <button class = "operator" id = "divide">/</button>
            </div>
            <div class = "row"> 
                <button class = "number" id = "7">7</button>
                <button class = "number" id = "8">8</button>
                <button class = "number" id = "9">9</button>
                <button class = "operator" id = "multiply">x</button>
            </div>
            <div class = "row"> 
                <button class = "number" id = "4">4</button>
                <button class = "number" id = "5">5</button>
                <button class = "number" id = "6">6</button>
                <button class = "operator" id = "subtract">-</button>
            </div>
            <div class = "row"> 
                <button class = "number" id = "1">1</button>
                <button class = "number" id = "2">2</button>
                <button class = "number" id = "3">3</button>
                <button class = "operator" id = "addition">+</button>
            </div>
            <div class = "row">
                <button class = "function" id = "posNeg">+/-</button>
                <button class = "number" id = "0">0</button>
                <button class = "number" id = "decimal">.</button>
                <button class = "operator" id = "equals">=</button>
            </div>
        </div>
    </div>
    <script src = "script.js"> </script>
</body>
</html>
